name: Build imports

on:
  schedule:
    # 03:00 UTC on the 10th of every month
    - cron: '0 3 10 * *'
  workflow_dispatch:

jobs:
    conversion-PW:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get robot
        run: |
            wget https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
            wget https://github.com/ontodev/robot/releases/download/v1.9.0/robot.jar
      - name: Remove current files, set up artifacts folder
        run: |
            rm -f data/PathwayOntology.ttl
            mkdir -p artifacts
      - name: Get latest version of the ontology
        run: curl -o data/pw.owl -m 1000 -fsSL http://purl.obolibrary.org/obo/pw.owl
      - name: ROBOT convert
        run: sh ./robot convert --input data/pw.owl --output artifacts/PathwayOntology.ttl
      - name: upload PathwayOntology.ttl as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: pw
          path: artifacts

    conversion-DOID:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get robot
        run: |
            wget https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
            wget https://github.com/ontodev/robot/releases/download/v1.9.0/robot.jar
      - name: Remove current files
        run: |
            rm -f data/DiseaseOntology.ttl
            mkdir -p artifacts
      - name: Get latest version of the ontology
        run: curl -o data/doid.owl -m 1000 -fsSL http://purl.obolibrary.org/obo/doid.owl
      - name: ROBOT convert
        run: sh ./robot convert --input data/doid.owl --output artifacts/DiseaseOntology.ttl
      - name: upload DiseaseOntology.ttl as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: doid
          path: artifacts

    conversion-CL:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get robot
        run: |
            wget https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
            wget https://github.com/ontodev/robot/releases/download/v1.9.0/robot.jar
      - name: Remove current files
        run: |
            rm -f data/CellOntology.ttl
            mkdir -p artifacts
      - name: Get latest version of the ontology
        run: curl -o data/cl.owl -m 1000 -fsSL http://purl.obolibrary.org/obo/cl.owl
      - name: ROBOT convert
        run: sh ./robot convert --input data/cl.owl --output artifacts/CellOntology.ttl
      - name: upload CellOntology.ttl as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: cl
          path: artifacts

    slim-CHEBI:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get robot and slimmer
        run: |
            wget https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
            wget https://github.com/ontodev/robot/releases/download/v1.9.0/robot.jar
            wget -N https://github.com/enanomapper/slimmer/releases/download/v1.0.1/slimmer-1.0.1-jar-with-dependencies.jar
      - name: Remove current files
        run: |
            rm -f data/chebi-slim.ttl
            mkdir -p artifacts
      - name: Get latest version of the ontology
        run: |
            wget https://raw.githubusercontent.com/enanomapper/ontologies/master/config/chebi.props
            wget -N `grep "owl=" chebi.props | cut -d'=' -f2`
      - name: Retrieve WP CHEBI terms (config file for Slimmer)
        run: |
            echo "SELECT DISTINCT ?chebi WHERE { [] wp:bdbChEBI ?chebi }" > chebi.rq
            curl -H "Accept: text/tab-separated-values" --data-urlencode query@chebi.rq -G https://sparql.wikipathways.org/sparql -o chebi.tsv
            grep -v "\"chebi\"" chebi.tsv > chebi2.tsv
            sed -i 's/"https:\/\/identifiers.org\/chebi\/CHEBI:/+U:http:\/\/purl.obolibrary.org\/obo\/CHEBI_/' chebi2.tsv
            sed -i 's/\"//' chebi2.tsv
            cp chebi2.tsv chebi.iris
      - name: Slim CHEBI and convert to turtle
        run: |
            java -cp slimmer-1.0.1-jar-with-dependencies.jar com.github.enanomapper.Slimmer .
            sh ./robot convert --input chebi-slim.owl --output artifacts/chebi-slim.ttl
      - name: upload chebi-slim.ttl as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: chebi-slim
          path: artifacts

    push-changes:
      needs: [conversion-PW,conversion-CL,conversion-DOID,slim-CHEBI]
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download the artifacted turtle files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the turtle files into data/
        run: find artifacts -name "*.ttl" -exec mv "{}" ./data \;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rdflib
        run: pip install --quiet 'rdflib>=7,<8'
      - name: Regenerate the ontology VoID description
        run: python3 scripts/build_ontology_void.py
      - name: Commit and push artifacts
        run: |
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add data/*.ttl
            if git diff --cached --quiet; then
              echo "No ontology changes to commit."
            else
              git commit -m "Automated build"
              git push
            fi
